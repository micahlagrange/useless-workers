name: continuous-integration
on: [push]
env:
  GAME_NAME: human-resources
  # unfortunately we need to also hardcode game name here in env since definitions in env can't reference eachother
  ARTIFACT_PATH_LOVE: main/makelove-build/love/human-resources.love
  ARTIFACT_PATH_APPIMAGE: main/makelove-build/appimage/human-resources.AppImage
  ARTIFACT_PATH_WIN64: main/makelove-build/win64/human-resources-win64.zip
  ARTIFACT_PATH_MACOS: main/makelove-build/macos/human-resources-macos.zip
  ARTIFACT_PATH_LOVEJS: main/makelove-build/lovejs/human-resources-lovejs.zip
  ITCH_USER: multivoxmuse
  # The itch page this repo has always published to. Create a new page and change
  # this value when Human Resources gets its own page.
  ITCH_GAME: morphi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: main

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run unit tests
      run: |
        pip install lupa
        cd main && python3 tst/run.py

    - name: Update
      run: sudo apt-get update

    - name: Install Dependencies
      # wine for the win64 exe metadata, libfuse2 so appimagetool can run
      run: |
        sudo apt-get install --assume-yes wine wine64
        sudo apt-get install --assume-yes libfuse2t64 || sudo apt-get install --assume-yes libfuse2

    - name: Checkout makelove
      uses: actions/checkout@v4
      with:
        repository: pfirsich/makelove
        path: makelove

    - name: Install makelove
      run: pip install ./makelove

    - name: Build
      run: |
        set -o pipefail
        cd main && python3 -m makelove 2>&1 | tee build_output.log

    - name: Print build output
      if: failure()
      run: cat main/build_output.log

    - name: list artifacts
      run: find main/makelove-build -maxdepth 2 -type f -exec ls -l {} \;

    - name: Upload to Github (love)
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.GAME_NAME}} - love
        path: ${{env.ARTIFACT_PATH_LOVE}}

    - name: Upload to Github (web)
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.GAME_NAME}} - web
        path: ${{env.ARTIFACT_PATH_LOVEJS}}

    - name: Upload to Github (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.GAME_NAME}} - linux
        path: ${{env.ARTIFACT_PATH_APPIMAGE}}

    - name: Upload to Github (Win64)
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.GAME_NAME}} - win64
        path: ${{env.ARTIFACT_PATH_WIN64}}

    - name: Upload to Github (MacOS)
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.GAME_NAME}} - macos
        path: ${{env.ARTIFACT_PATH_MACOS}}

    # butler is fetched directly instead of through a Docker action: the action's
    # image build pulls from broth.itch.ovh at job start and took the whole job
    # down when that host failed to resolve.
    - name: Install butler
      run: |
        set -e
        curl -fsSL -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip \
          || curl -fsSL -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
        mkdir -p butler-bin
        unzip -o butler.zip -d butler-bin
        BUTLER=$(find butler-bin -type f -name butler | head -1)
        chmod +x "$BUTLER"
        "$BUTLER" -V
        echo "BUTLER=$BUTLER" >> "$GITHUB_ENV"

    - name: Publish to Itch.io
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
      run: |
        set -e
        B="$BUTLER"
        $B push "$ARTIFACT_PATH_LOVEJS"   "$ITCH_USER/$ITCH_GAME:html"
        $B push "$ARTIFACT_PATH_APPIMAGE" "$ITCH_USER/$ITCH_GAME:linux"
        $B push "$ARTIFACT_PATH_WIN64"    "$ITCH_USER/$ITCH_GAME:windows"
        $B push "$ARTIFACT_PATH_MACOS"    "$ITCH_USER/$ITCH_GAME:osx"
