<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morphis Field Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   FIELD JOURNAL - design tokens
   spacing: 8px grid (4px half-step only inside components)
   type: 4 steps - 12 caption / 14 body / 18 heading / 24 display
   ====================================================================== */
:root{
  --s-h:4px; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px;
  --t-cap:12px; --lh-cap:16px;
  --t-body:14px; --lh-body:20px;
  --t-head:18px; --lh-head:24px;
  --t-disp:24px; --lh-disp:32px;
  --paper:#F6F0E1; --paper-2:#EDE4CE; --paper-3:#E3D7B9; --line:#CFC19F;
  --ink:#2B281F; --ink-2:#575140; --ink-off:#8F876F;
  --moss:#3F6B35; --moss-soft:#DDE7CC;
  --berry:#A13A2D; --berry-soft:#F4DAD3;
  --honey:#865710; --honey-soft:#F5E3B9; --honey-fill:#D9A441;
  --sky:#2E5E7D;
  --r1:8px; --r2:16px;
  --btn-md:40px; --btn-sm:32px;
  --sheet-w:336px; --strip-h:48px;
  --shadow:0 1px 0 rgba(43,40,31,.06),0 8px 24px rgba(43,40,31,.14);
  --font:'Nunito',system-ui,sans-serif; --font-d:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#D9D2BF;color:var(--ink);font:400 var(--t-body)/var(--lh-body) var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic.l{width:24px;height:24px}

/* ---------- mockup chrome (not part of the game) ---------- */
.mockbar{display:flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s2);background:#2B281F;color:#F6F0E1;position:sticky;top:0;z-index:50;overflow-x:auto;scrollbar-width:none}
.mockbar::-webkit-scrollbar{display:none}
.mockbar b{font:600 var(--t-head)/var(--lh-head) var(--font-d);white-space:nowrap;margin-right:var(--s1)}
.mockbar .grp{display:flex;gap:var(--s-h);flex:none}
.mockbar button{height:32px;padding:0 12px;border-radius:var(--r1);border:1px solid #57513f;background:transparent;color:#F6F0E1;font-weight:600;white-space:nowrap;cursor:pointer}
.mockbar button[aria-pressed=true]{background:#F6F0E1;color:#2B281F}
.mockbar .sep{width:1px;height:24px;background:#57513f;flex:none;margin:0 var(--s1)}
.stage{display:flex;justify-content:center;padding:var(--s2)}
#game{position:relative;width:min(1280px,100%);height:min(720px,calc(100vh - 80px));min-height:520px;border-radius:var(--r2);overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.25);container-type:size;container-name:game;background:#9DC07A}
.stage.phone #game{width:390px;height:844px;border-radius:32px;border:8px solid #2B281F}
@media (max-width:600px){
  .stage{padding:0}
  #game,.stage.phone #game{width:100%;height:calc(100dvh - 48px);min-height:0;border-radius:0;border:0}
  .frame-grp{display:none}
}

/* ---------- the game UI ---------- */
.ui{position:absolute;inset:0;display:grid;grid-template-rows:var(--strip-h) 1fr;grid-template-columns:1fr var(--sheet-w);user-select:none;-webkit-user-select:none}
.ui.sheet-hidden{grid-template-columns:1fr 0}

/* top strip */
.strip{grid-column:1/-1;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s1) 0 var(--s2);background:rgba(246,240,225,.97);border-bottom:1px solid var(--line);z-index:5;min-width:0}
.res{display:flex;gap:var(--s2);align-items:center;min-width:0}
.res .it{display:flex;align-items:center;gap:var(--s-h);white-space:nowrap}
.res .it b{font-weight:800}
.res .it span{color:var(--ink-2)}
.res .it.low b{color:var(--berry)}
.when{display:flex;gap:var(--s1);align-items:center;color:var(--ink-2);white-space:nowrap;padding-left:var(--s2);border-left:1px solid var(--line)}
.when b{color:var(--ink);font-weight:800}
.when .sicon{display:none}
.when .t.warn{color:var(--berry);font-weight:800}
.strip .spacer{flex:1}
.strip .ctl{display:flex;gap:var(--s1);align-items:center}

/* ONE button, two sizes */
.btn{height:var(--btn-md);min-width:var(--btn-md);padding:0 var(--s2);display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);border-radius:var(--r1);border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 var(--t-body)/var(--lh-body) var(--font);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn.sm{height:var(--btn-sm);min-width:var(--btn-sm);padding:0 12px}
.btn.ico{padding:0}
.btn:hover{background:var(--paper-2)}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn[aria-pressed=true]{background:var(--moss);border-color:var(--moss);color:#fff}
.btn[aria-pressed=true] .k{color:#fff;border-color:rgba(255,255,255,.5)}
.btn:disabled,.btn[aria-disabled=true]{color:var(--ink-off);background:var(--paper);border-style:dashed;cursor:not-allowed}
.btn.warn{color:var(--berry)}
.btn.full{width:100%}
.k{font:800 var(--t-cap)/var(--lh-cap) var(--font);color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;min-width:16px;text-align:center}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:var(--r1) 0 0 var(--r1);margin-left:0}
.seg .btn:last-child{border-radius:0 var(--r1) var(--r1) 0}

/* map */
.map{grid-row:2;grid-column:1;position:relative;overflow:hidden;touch-action:none}
.ui.sheet-hidden .map{grid-column:1/-1}
.map svg.world{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
.ui[data-tool=dig] svg.world,.ui[data-tool=bridge] svg.world{cursor:crosshair}
.ui[data-tool=stash] svg.world,.ui[data-tool=basket] svg.world,.ui[data-tool=nest] svg.world{cursor:copy}
.ui.paused svg.world{filter:saturate(.45) brightness(1.04)}
.mo{transition-property:transform;transition-timing-function:ease-in-out;cursor:pointer}
.mo .ring{opacity:0}
.mo.sel .ring{opacity:1}
.bld{cursor:pointer}
.bld.sel .ring{opacity:1}
.bld .ring{opacity:0}
.tile{stroke:rgba(70,40,20,.18);stroke-width:1}
.tile.mark{fill:url(#hatch)}
.tile.dug{fill:#C9A57A}
.site{opacity:.55}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
.ui.paused .bob{animation-play-state:paused}

/* notices on the map: mode chip, paused, alerts */
.notices{position:absolute;top:var(--s2);left:var(--s2);right:var(--s2);display:flex;flex-direction:column;align-items:center;gap:var(--s1);pointer-events:none;z-index:4}
.chip{pointer-events:auto;display:flex;align-items:center;gap:var(--s1);min-height:var(--btn-md);padding:var(--s-h) var(--s-h) var(--s-h) var(--s2);background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);max-width:100%}
.chip .txt{display:flex;flex-direction:column;min-width:0;padding:var(--s-h) 0}
.chip .txt b{font-weight:800}
.chip .txt span{color:var(--ink-2)}
.chip.alert{border-color:#D9A095;background:#FBEDE8}
.chip.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--berry);flex:none}
.chip.pause{padding-right:var(--s2)}
.toast{position:absolute;left:50%;bottom:var(--s3);transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:var(--s1) var(--s2);border-radius:var(--r2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:6;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}

/* the ONE side sheet */
.sheet{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0;background:var(--paper);border-left:1px solid var(--line);z-index:5;position:relative;
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(140,120,80,.10) 23px 24px)}
.ui.sheet-hidden .sheet{display:none}
.grab{display:none}
.sh-head{padding:var(--s2) var(--s2) var(--s1);display:flex;flex-direction:column;gap:var(--s1);background:var(--paper);border-bottom:1px solid var(--line)}
.sh-top{display:flex;align-items:flex-start;gap:var(--s1)}
.sh-top .ttl{flex:1;min-width:0}
.cap{font:800 var(--t-cap)/var(--lh-cap) var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h2{margin:0;font:600 var(--t-disp)/var(--lh-disp) var(--font-d)}
h3{margin:0;font:800 var(--t-head)/var(--lh-head) var(--font)}
.sub{margin:0;color:var(--ink-2)}
.sh-body{flex:1;overflow-y:auto;padding:var(--s2);display:flex;flex-direction:column;gap:var(--s3);overscroll-behavior:contain}
.sh-foot{padding:var(--s1) var(--s2) var(--s2);display:flex;gap:var(--s1);background:var(--paper);border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}
.tabs{display:flex}
.tabs .btn{flex:1}
.sec{display:flex;flex-direction:column;gap:var(--s1)}
.sec .hint{color:var(--ink-2);margin:0}

/* card + list row */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.card.pad{padding:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s2);min-height:56px;padding:var(--s1) var(--s2);border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--paper-2)}
.row[aria-pressed=true]{background:var(--moss-soft);box-shadow:inset 4px 0 0 var(--moss)}
.row[aria-disabled=true]{cursor:not-allowed}
.row[aria-disabled=true] .nm{color:var(--ink-off)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-weight:800}
.row .ds{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;align-items:center;gap:var(--s1);color:var(--ink-2);white-space:nowrap}
.row .end.bad{color:var(--berry);font-weight:800}
.row .end.good{color:var(--moss);font-weight:800}
.row .end.ok{color:var(--honey);font-weight:800}
.row .icon{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:var(--r1);background:var(--paper-2)}

/* meter */
.meter{display:grid;grid-template-columns:64px 1fr 96px;align-items:center;gap:var(--s1)}
.meter .bar{height:8px;border-radius:4px;background:var(--paper-3);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.meter .w{font-weight:800;text-align:right}
.lv-good i{background:var(--moss)} .lv-good .w{color:var(--moss)}
.lv-ok i{background:var(--honey-fill)} .lv-ok .w{color:var(--honey)}
.lv-bad i{background:var(--berry)} .lv-bad .w{color:var(--berry)}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1)}
.chips .btn{padding:0 var(--s1)}
.chips .btn.disliked{border-style:dashed;color:var(--honey)}
.chips .btn.disliked[aria-pressed=true]{background:var(--honey);border-color:var(--honey);border-style:solid;color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1)}
.acts .a{display:flex;flex-direction:column;align-items:center;gap:var(--s-h)}
.acts .a .btn{width:100%}
.acts .a small{font:600 var(--t-cap)/var(--lh-cap) var(--font);color:var(--ink-2)}
.acts .a small.bad{color:var(--berry)}
.pockets{display:flex;gap:var(--s1)}
.pocket{flex:1;display:flex;align-items:center;gap:var(--s1);height:var(--btn-md);padding:0 12px;border:1px dashed var(--line);border-radius:var(--r1);color:var(--ink-2)}
.pocket b{color:var(--ink)}
.vign{height:128px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);display:block;width:100%}
.slots{display:flex;gap:var(--s1)}
.slot{width:48px;height:48px;border:1px dashed var(--line);border-radius:var(--r1);display:grid;place-items:center;background:var(--paper-2)}
.slot.full{border-style:solid;background:var(--paper)}
.field{width:100%;min-height:80px;padding:var(--s1) 12px;border:1px solid var(--line);border-radius:var(--r1);background:#FFFDF7;font:400 var(--t-body)/var(--lh-body) var(--font);color:var(--ink);resize:vertical}
.slider{display:grid;grid-template-columns:72px 1fr 40px;gap:var(--s1);align-items:center}
.slider input{width:100%;accent-color:var(--moss)}
.slider b{text-align:right}
.inline-confirm{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s2);border:1px solid #D9A095;background:#FBEDE8;border-radius:var(--r2)}
.palette .row .icon{color:var(--moss)}
.palette .row .ds{white-space:normal}
.row .ds .cost{color:var(--ink);font-weight:600}.row .ds .cost.bad{color:var(--berry)}.pc{display:none}
.pile{display:flex;gap:var(--s2);color:var(--ink-2)}
.pile b{color:var(--ink)}

/* ---------- phone: the sheet becomes a bottom sheet ---------- */
@container game (max-width: 640px){
  .ui{--btn-md:48px;--btn-sm:40px;grid-template-columns:1fr}
  .ui.sheet-hidden{grid-template-columns:1fr}
  .map,.ui.sheet-hidden .map{grid-column:1}
  .strip{gap:var(--s1);padding:0 var(--s1)}
  .res{gap:var(--s1)}
  .res .it span,.when .long,.when .season,.k,.hide-phone{display:none}
  .when .sicon{display:block}
  .when{padding-left:var(--s1);gap:var(--s-h)}
  .strip .ctl{gap:var(--s-h)}
  .strip .ctl .seg{display:none}
  .strip .ctl .speedcycle{display:inline-flex}
  .sheet{position:absolute;left:0;right:0;bottom:0;grid-row:auto;grid-column:auto;border-left:0;border-top:1px solid var(--line);border-radius:var(--r2) var(--r2) 0 0;box-shadow:0 -8px 24px rgba(43,40,31,.16);max-height:62%;transition:max-height .25s}
  .sheet.tall{max-height:88%}
  .ui.sheet-hidden .sheet{display:flex}
  .grab{display:flex;justify-content:center;padding:var(--s1) 0 0;border:0;background:transparent;width:100%;cursor:pointer}
  .grab i{width:40px;height:4px;border-radius:2px;background:var(--line)}
  .sh-head{padding-top:var(--s1)}
  .palette.card{border:0;border-radius:0;background:transparent;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1)}
  .palette .row{flex-direction:column;gap:var(--s-h);min-height:88px;padding:var(--s1) var(--s-h);border:1px solid var(--line);border-radius:var(--r1);background:var(--paper);text-align:center;justify-content:center}
  .palette .row .mid{align-items:center}
  .palette .row .ds{display:none}
  .palette .row .pc{display:block}
  .palette .row .end{font:600 var(--t-cap)/var(--lh-cap) var(--font);white-space:normal;justify-content:center}
  .palette .row[aria-pressed=true]{box-shadow:inset 0 -4px 0 var(--moss)}
  .notices{top:var(--s1);left:var(--s1);right:var(--s1)}
  .meter{grid-template-columns:56px 1fr 88px}
}
@container game (min-width: 641px){ .speedcycle{display:none !important} }
@media (pointer:coarse){ .k{display:none} }

/* ---------- design notes drawer ---------- */
.notes{position:fixed;top:48px;right:0;bottom:0;width:min(720px,100%);background:#FFFDF7;border-left:1px solid var(--line);box-shadow:-16px 0 48px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .25s;z-index:60;overflow-y:auto;padding:var(--s3)}
.notes.open{transform:none}
.notes h2{margin-bottom:var(--s1)}
.notes h3{margin:var(--s3) 0 var(--s1)}
.notes p,.notes li{color:var(--ink)}
.notes table{border-collapse:collapse;width:100%;margin:var(--s1) 0}
.notes th,.notes td{text-align:left;vertical-align:top;padding:var(--s1);border-bottom:1px solid var(--line)}
.notes th{font:800 var(--t-cap)/var(--lh-cap) var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.notes code{font:600 12px/16px ui-monospace,Consolas,monospace;background:var(--paper-2);padding:0 4px;border-radius:4px}
.notes td.n{font-weight:800;white-space:nowrap}
.notes td.n.good{color:var(--moss)}
.notes ol{padding-left:var(--s3)}
.notes li{margin-bottom:var(--s1)}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;border:1px solid rgba(0,0,0,.15);margin-right:var(--s-h)}
.specimen{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s2);border:1px solid var(--line);border-radius:var(--r2);background:var(--paper)}
.notes .close{position:sticky;top:0;float:right}
</style>
</head>
<body>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#B07A4A"/><rect width="3" height="8" fill="#F6F0E1" opacity=".75"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <symbol id="i-berry" viewBox="0 0 24 24"><circle cx="9" cy="14" r="5" fill="#C2453A" stroke="none"/><circle cx="15.5" cy="13" r="4.5" fill="#D9584B" stroke="none"/><path d="M12 9c0-3 2-5 5-5" stroke="#3F6B35"/></symbol>
  <symbol id="i-stick" viewBox="0 0 24 24"><path d="M4 19 19 5M9 14l-3-5M14 9l4 2" stroke="#7A5230" stroke-width="2.4"/></symbol>
  <symbol id="i-shiny" viewBox="0 0 24 24"><path d="M12 3l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#E9C24A" stroke="#9C7A18" stroke-width="1.4"/></symbol>
  <symbol id="i-grass" viewBox="0 0 24 24"><path d="M6 20c0-6 1-10 3-13M12 20c0-7 0-11 0-15M18 20c0-6-1-10-3-13" stroke="#4F8A3A" stroke-width="2.2"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-15 15z" fill="#7DB35A" stroke="#3F6B35" stroke-width="1.4"/><path d="M5 19 14 10" stroke="#3F6B35"/></symbol>
  <symbol id="i-blob" viewBox="0 0 24 24"><path d="M4 18c0-7 3.5-12 8-12s8 5 8 12z" fill="#D9A066" stroke="#7A5230" stroke-width="1.4"/><circle cx="9.5" cy="13" r="1.2" fill="#2B281F" stroke="none"/><circle cx="14.5" cy="13" r="1.2" fill="#2B281F" stroke="none"/></symbol>
  <symbol id="i-dig" viewBox="0 0 24 24"><path d="M14 4l6 6M17 7 8 16"/><path d="M8 16l-4 4 1-5 3-3 4 4-3 3-5 1z" fill="currentColor" stroke="none" opacity=".25"/><path d="M5 15l4 4"/></symbol>
  <symbol id="i-stash" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="4"/><path d="M6 13c2-4 10-4 12 0"/></symbol>
  <symbol id="i-basket" viewBox="0 0 24 24"><path d="M4 10h16l-2 9H6z"/><path d="M8 10c0-4 8-4 8 0M7 14h10"/></symbol>
  <symbol id="i-nest" viewBox="0 0 24 24"><path d="M3 13c2 6 16 6 18 0"/><path d="M4 13c3-2 13-2 16 0M6 16l3-3M11 17l2-4M16 16l-2-3"/></symbol>
  <symbol id="i-bridge" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M6 9v6M10 9v6M14 9v6M18 9v6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>

/* =====================================================================

function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function drawMeadow(){
  const r = rnd(7);
  const tufts = $('#tufts');
  for (let i = 0; i < 220; i++){ const x = r()*1600, y = r()*1000; el('path',{d:`M${x} ${y} l-3 -8 M${x+3} ${y} l0 -10 M${x+6} ${y} l3 -8`, stroke:'#6E9A4E','stroke-width':2,'stroke-linecap':'round'},tufts); }
  for (let i = 0; i < 40; i++){ const x = r()*1600, y = r()*1000; el('circle',{cx:x,cy:y,r:3,fill:['#F6F0E1','#F2D16B','#E9A6B8'][i%3]},tufts); }
  // trees, top left
  const trees = $('#trees');
  [[320,200],[400,160],[260,300],[380,300],[460,250],[200,180],[1480,260],[1520,380]].forEach(([x,y]) => {
    const g = el('g',{transform:`translate(${x} ${y})`},trees);
    el('ellipse',{cx:0,cy:34,rx:30,ry:8,fill:'rgba(40,60,20,.25)'},g);
    el('rect',{x:-5,y:8,width:10,height:26,rx:3,fill:'#7A5230'},g);
    el('circle',{cx:0,cy:-6,r:30,fill:'#4F8A3A'},g);
    el('circle',{cx:-12,cy:-14,r:14,fill:'#66A24C'},g);
  });
  // berry bushes, bottom right
  const bushes = $('#bushes');
  [[1120,760],[1200,700],[1060,820],[1230,800],[1150,860]].forEach(([x,y],i) => {
    const g = el('g',{transform:`translate(${x} ${y})`},bushes);
    el('ellipse',{cx:0,cy:18,rx:30,ry:7,fill:'rgba(40,60,20,.25)'},g);
    el('circle',{cx:-12,cy:0,r:18,fill:'#3F7A35'},g); el('circle',{cx:12,cy:-2,r:20,fill:'#4C8C3E'},g); el('circle',{cx:0,cy:-12,r:16,fill:'#58994A'},g);
    if (i !== 2) [[-10,-4],[6,-12],[14,4],[-2,6]].forEach(([a,b]) => el('circle',{cx:a,cy:b,r:4,fill:'#C2453A'},g));
  });
  // clay patches as tiles
  const clay = $('#clay');
  const patch = (ox,oy,cols,rows,skip) => {
    for (let r0 = 0; r0 < rows; r0++) for (let c = 0; c < cols; c++){
      if (skip(c,r0)) continue;
      const t = {x:ox + c*28, y:oy + r0*28, mark:false, dug:false, shiny: ((c*7 + r0*13) % 9) === 0};
      t.el = el('rect',{x:t.x,y:t.y,width:28,height:28,fill:'#B07A4A',class:'tile'},clay);
      t.el.setAttribute('fill', (c + r0) % 2 ? '#B07A4A' : '#A87244');
      tiles.push(t);
    }
  };
  patch(1000,140,9,7,(c,r) => (r===0 && (c<2||c>6)) || (r===6 && (c<1||c>5)) || (c===8 && r>4));
  patch(170,620,7,6,(c,r) => (r===0 && (c===0||c===6)) || (r===5 && c>4));
  // a couple pre-dug tunnel tiles
  tiles.slice(20,23).forEach(t => { t.dug = true; });
  paintTiles();
}
function paintTiles(){ tiles.forEach(t => { t.el.classList.toggle('mark', t.mark && !t.dug); t.el.classList.toggle('dug', t.dug); }); }

function blob(g, m, s=1){
  el('ellipse',{class:'ring',cx:0,cy:2,rx:22*s,ry:9*s,fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 4'},g);
  el('ellipse',{cx:0,cy:2,rx:15*s,ry:5*s,fill:'rgba(40,60,20,.28)'},g);
  const b = el('g',{class:'bob'},g);
  b.style.animationDelay = (Math.random()*1.5).toFixed(2) + 's';
  if (m.species === 'Twins'){
    el('path',{d:`M${-16*s} 0 c0 -14 ${4*s} -20 ${9*s} -20 s${9*s} 6 ${9*s} 20 z`,fill:m.color,stroke:'rgba(0,0,0,.35)','stroke-width':1.5},b);
    el('path',{d:`M${-1*s} 0 c0 -12 ${4*s} -17 ${8*s} -17 s${8*s} 5 ${8*s} 17 z`,fill:m.color,stroke:'rgba(0,0,0,.35)','stroke-width':1.5},b);
    [[-10,-8],[-4,-8],[4,-7],[10,-7]].forEach(([x,y]) => el('circle',{cx:x*s,cy:y*s,r:1.6*s,fill:'#2B281F'},b));
    return;
  }
  el('path',{d:`M${-15*s} 0 c0 -18 ${6*s} -26 ${15*s} -26 s${15*s} 8 ${15*s} 26 z`,fill:m.color,stroke:'rgba(0,0,0,.35)','stroke-width':1.5},b);
  if (m.species === 'Pupper') { el('ellipse',{cx:-13*s,cy:-16*s,rx:4*s,ry:8*s,fill:'#9C6A3A'},b); el('ellipse',{cx:13*s,cy:-16*s,rx:4*s,ry:8*s,fill:'#9C6A3A'},b); }
  if (m.species === 'Cwab') { el('circle',{cx:-18*s,cy:-8*s,r:5*s,fill:m.color,stroke:'rgba(0,0,0,.35)'},b); el('circle',{cx:18*s,cy:-8*s,r:5*s,fill:m.color,stroke:'rgba(0,0,0,.35)'},b); }
  if (m.species === 'Ribbit') { el('circle',{cx:-6*s,cy:-23*s,r:5*s,fill:m.color,stroke:'rgba(0,0,0,.35)'},b); el('circle',{cx:6*s,cy:-23*s,r:5*s,fill:m.color,stroke:'rgba(0,0,0,.35)'},b); }
  if (m.species === 'Woofoof') { el('path',{d:`M${-10*s} ${-22*s} q${-6*s} ${-8*s} ${-2*s} ${-12*s} M${10*s} ${-22*s} q${6*s} ${-8*s} ${2*s} ${-12*s}`,stroke:'#8A97A3','stroke-width':3*s,fill:'none','stroke-linecap':'round'},b); }
  if (m.species === 'Blob') { el('circle',{cx:-5*s,cy:-20*s,r:3*s,fill:'#fff',opacity:.6},b); }
  el('circle',{cx:-5*s,cy:-12*s,r:2*s,fill:'#2B281F'},b); el('circle',{cx:5*s,cy:-12*s,r:2*s,fill:'#2B281F'},b);
  el('path',{d:`M${-3*s} ${-6*s} q${3*s} ${3*s} ${6*s} 0`,stroke:'#2B281F','stroke-width':1.5,fill:'none','stroke-linecap':'round'},b);
}
function drawMorphis(){
  const root = $('#morphis'); root.innerHTML = '';
  morphis.forEach(m => {
    m.x = m.x ?? m.ax; m.y = m.y ?? m.ay;
    const g = el('g',{class:'mo','data-kind':'morphi','data-id':m.id},root);

function drawBuilds(){

function buildShape(g, kind, ghost){
  el('ellipse',{class:'ring',rx:30,ry:16,cy:4,fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 4'},g);
  if (kind === 'stash'){

  } else if (kind === 'basket'){
    el('path',{d:'M-20 -10 h40 l-5 20 h-30 z',fill:'#C89B5C',stroke:'#7A5230','stroke-width':2},g);
    el('path',{d:'M-14 -10 q14 -18 28 0 M-18 -2 h36 M-16 5 h32',stroke:'#7A5230','stroke-width':1.6,fill:'none'},g);
  } else if (kind === 'nest'){
    el('ellipse',{rx:26,ry:13,fill:'#8C6239'},g); el('ellipse',{rx:18,ry:8,cy:-1,fill:'#E8D7A8'},g);

}
function markSel(){
  morphis.forEach(m => m.el && m.el.classList.toggle('sel', S.sel?.type === 'morphi' && S.sel.id === m.id));
  baby.el && baby.el.classList.toggle('sel', S.sel?.type === 'baby');
  builds.forEach(b => b.el && b.el.classList.toggle('sel', S.sel?.type === 'build' && S.sel.id === b.id));
  $('#home').classList.toggle('sel', S.sel?.type === 'home');

/* =====================================================================
   camera: viewBox pan and zoom
   ===================================================================== */
const vb = {x:300,y:140,w:1000,h:700};
function setVB(){ vb.x = Math.max(-100, Math.min(1700 - vb.w, vb.x)); vb.y = Math.max(-100, Math.min(1100 - vb.h, vb.y)); world.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function unitsPerPx(){ const r = world.getBoundingClientRect(); return 1 / Math.max(r.width / vb.w, r.height / vb.h); }
function toSvg(e){ const p = new DOMPoint(e.clientX, e.clientY); return p.matrixTransform(world.getScreenCTM().inverse()); }
function lookAt(x,y){ const k = unitsPerPx(); vb.x = x - vb.w/2; vb.y = y - vb.h/2 + (isPhone() ? sheet.offsetHeight*k/2 : 0); setVB(); }

/* =====================================================================
   pointer input on the meadow
   ===================================================================== */
let drag = null;
world.addEventListener('contextmenu', e => e.preventDefault());
world.addEventListener('pointerdown', e => {
  world.setPointerCapture(e.pointerId);
  const p = toSvg(e);
  drag = {p0:p, sx:e.clientX, sy:e.clientY, vx:vb.x, vy:vb.y, moved:false, pan: e.button === 2 || !S.tool || ['stash','basket','nest'].includes(S.tool), target: e.target.closest('[data-kind]')};
  if (S.tool === 'dig' && e.button !== 2){ const t = tileAt(p); drag.clearing = !!(t && t.mark); }
});
world.addEventListener('pointermove', e => {
  const p = toSvg(e);
  if (!drag){ ghostAt(p); return; }
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  if (!drag.moved) return;
  if (drag.pan){ const k = unitsPerPx(); vb.x = drag.vx - (e.clientX - drag.sx)*k; vb.y = drag.vy - (e.clientY - drag.sy)*k; setVB(); if (S.follow){ S.follow = false; renderSheet(); } return; }
  if (S.tool === 'dig') ghostRect(drag.p0, p);
  if (S.tool === 'bridge') ghostLine(drag.p0, p);
});
world.addEventListener('pointerup', e => {
  if (!drag) return;
  const p = toSvg(e), d = drag; drag = null;
  $('#ghost').innerHTML = '';
  // a tap on a morphi, a baby or a building always picks it, whatever tool is out
  if (!d.moved && d.target){ const k = d.target.dataset.kind; pick(k === 'morphi' ? 'morphi' : k === 'baby' ? 'baby' : k === 'home' ? 'home' : 'build', d.target.dataset.id); return; }
  if (d.pan && d.moved) return;
  if (S.tool === 'dig'){ markRect(d.p0, p, d.clearing); return; }
  if (S.tool === 'bridge'){ if (d.moved) layBridge(d.p0, p); else toast('Drag across a stream to lay a bridge'); return; }
  if (['stash','basket','nest'].includes(S.tool)){ place(S.tool, p, e.shiftKey); return; }
  if (!d.moved){ S.sel = null; renderAll(); }
});
world.addEventListener('wheel', e => {
  e.preventDefault();
  const p = toSvg(e), f = e.deltaY > 0 ? 1.12 : 1/1.12;
  const nw = Math.max(500, Math.min(1500, vb.w * f)), nh = nw * 0.7;
  vb.x = p.x - (p.x - vb.x) * nw / vb.w; vb.y = p.y - (p.y - vb.y) * nh / vb.h; vb.w = nw; vb.h = nh; setVB();
}, {passive:false});

function tileAt(p){ return tiles.find(t => p.x >= t.x && p.x < t.x + 28 && p.y >= t.y && p.y < t.y + 28); }
function ghostRect(a,b){
  const g = $('#ghost'); g.innerHTML = '';
  const x = Math.min(a.x,b.x), y = Math.min(a.y,b.y), w = Math.abs(a.x-b.x), h = Math.abs(a.y-b.y);
  el('rect',{x,y,width:w,height:h,fill: drag?.clearing ? 'rgba(161,58,45,.15)' : 'rgba(246,240,225,.25)',stroke: drag?.clearing ? '#A13A2D' : '#fff','stroke-width':3,'stroke-dasharray':'8 6',rx:4},g);
}
function ghostLine(a,b){
  const g = $('#ghost'); g.innerHTML = '';
  const n = Math.max(1, Math.round(Math.hypot(b.x-a.x, b.y-a.y) / 24));
  const ok = n <= S.res.sticks;
  el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke: ok ? '#fff' : '#A13A2D','stroke-width':18,'stroke-linecap':'round',opacity:.6},g);
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2 - 24;
  el('rect',{x:mx-56,y:my-14,width:112,height:24,rx:8,fill:'#F6F0E1',stroke:'#CFC19F'},g);
  const t = el('text',{x:mx,y:my+3,'text-anchor':'middle','font-family':'Nunito','font-weight':800,'font-size':13,fill: ok ? '#2B281F' : '#A13A2D'},g);
  t.textContent = `${n} ${n>1?'sticks':'stick'} (have ${S.res.sticks})`;
}
function onWater(p){ try { return ['stream1','stream2'].some(id => document.getElementById(id).isPointInFill(new DOMPoint(p.x,p.y))); } catch(_) { return false; } }
function ghostAt(p){
  const g = $('#ghost');
  if (!['stash','basket','nest'].includes(S.tool)){ if (g.childNodes.length) g.innerHTML = ''; return; }
  g.innerHTML = '';
  const bad = onWater(p) || tileAt(p);
  const gg = el('g',{transform:`translate(${p.x} ${p.y})`},g);
  el('ellipse',{rx:32,ry:18,fill: bad ? 'rgba(161,58,45,.3)' : 'rgba(246,240,225,.35)',stroke: bad ? '#A13A2D' : '#fff','stroke-width':2,'stroke-dasharray':'5 4'},gg);
  buildShape(gg, S.tool, true);
}
function markRect(a,b,clearing){
  const x0 = Math.min(a.x,b.x), x1 = Math.max(a.x,b.x), y0 = Math.min(a.y,b.y), y1 = Math.max(a.y,b.y);
  let n = 0;
  tiles.forEach(t => { const cx = t.x + 14, cy = t.y + 14; const hit = (x1 - x0 < 6 && y1 - y0 < 6) ? (a.x >= t.x && a.x < t.x+28 && a.y >= t.y && a.y < t.y+28) : (cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1);
    if (hit && !t.dug){ t.mark = !clearing; n++; } });
  paintTiles();
  if (!n) toast('That is not clay. Drag over the brown patches.');
  else toast(clearing ? `Cleared ${n} marks` : `Marked ${n} clay for the diggers`);
  renderNotices();
}
function place(kind, p, keep){
  const t = TOOLS.find(x => x.id === kind);
  if (onWater(p) || tileAt(p)){ toast(`A ${t.name.toLowerCase()} needs open grass`); return; }
  if (!canAfford(t.cost)){ toast(`Needs ${short(t.cost)}`); return; }
  Object.entries(t.cost).forEach(([k,v]) => S.res[k] -= v);
  const b = {id:'b' + (builds.length + 1) + Date.now()%1000, kind, x:p.x, y:p.y, items:[], site:true};
  builds.push(b); drawBuilds();
  setTimeout(() => { b.site = false; drawBuilds(); log(`The bunch finished a ${kind}.`); }, 3000 / S.speed);
  toast(`${t.name} set out. A builder will make it.`);
  if (!keep) S.tool = null;
  renderAll();
}
function layBridge(a,b){
  const n = Math.max(1, Math.round(Math.hypot(b.x-a.x, b.y-a.y) / 24));
  if (n > S.res.sticks){ toast(`Needs ${n} sticks, the pile has ${S.res.sticks}`); return; }
  S.res.sticks -= n;
  const g = el('g',{},$('#bridges'));
  const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI;
  for (let i = 0; i < n; i++){ const f = (i + .5) / n; const x = a.x + (b.x-a.x)*f, y = a.y + (b.y-a.y)*f;
    el('rect',{x:-12,y:-14,width:22,height:28,rx:3,fill:'#B88A57',stroke:'#7A5230','stroke-width':2,transform:`translate(${x} ${y}) rotate(${ang})`,opacity:.55},g); }
  setTimeout(() => g.querySelectorAll('rect').forEach(r => r.setAttribute('opacity',1)), 2500 / S.speed);
  toast(`Bridge marked: ${n} ${n>1?'sticks':'stick'}`);
  renderStrip();
}

/* =====================================================================
   actions
   ===================================================================== */
function pick(type, id){
  if (type === 'morphi' || type === 'baby' || type === 'build' || type === 'home') S.sel = {type, id};
  S.menu = false; S.leaveAsk = false;
  if (type === 'baby') S.alertDismissed = true;
  if (isPhone()) S.tall = false;
  renderAll();
}
function setTool(id){
  S.tool = S.tool === id ? null : id;
  if (S.tool){ S.menu = false; if (S.sel && S.sel.type !== 'morphi') S.sel = null; S.tab = 'build'; }
  renderAll();
}
function setJob(m, slot, job){
  if (slot === 'main'){
    if (job === m.main) return;
    if (job === m.neutral) m.neutral = m.main;
    m.main = job;
    toast(`${m.name} is a ${job} first now${job === m.disliked ? ', and grumbles about it' : ''}`);
  } else {
    if (job === m.disliked){ toast(`${m.name} dislikes ${job} work. That is part of who it is.`); return; }
    if (job === m.main){ m.main = m.neutral || m.main; }
    m.neutral = job;
    toast(job ? `When there is no ${m.main} work, ${m.name} does ${job} work` : `${m.name} only does its main job now`);
  }
  renderSheet();
}
function feed(f){
  const e = pantry.find(x => x.food === f);
  if (!e || e.n < 1) return;
  e.n--; S.res.food--;
  let emo = 'heart', msg;
  if (e.taste === 'loved'){ baby.need.tummy = Math.min(100, baby.need.tummy + 30); baby.need.fun = Math.min(100, baby.need.fun + 6); msg = `${baby.name} gobbles the ${f} and wiggles`; }
  else if (e.taste === 'ok'){ baby.need.tummy = Math.min(100, baby.need.tummy + 15); emo = 'smile'; msg = `${baby.name} munches the ${f}`; }
  else if (e.taste === 'new'){ baby.need.tummy = Math.min(100, baby.need.tummy + 15); emo = 'question'; e.word = 'likes it'; e.taste = 'ok'; e.gain = 15; msg = `${baby.name} sniffs the ${f}... and likes it!`; }
  else { emo = 'yuck'; baby.need.fun = Math.max(0, baby.need.fun - 10); msg = `${baby.name} pushes the ${f} away. Yuck.`; }
  toast(msg); log(msg + '.');
  emote(emo);
  renderAll();
}
function tend(kind){
  if (kind === 'wash'){ if (S.res.grass < 1){ toast('Washing needs a tuft of grass'); return; } S.res.grass--; baby.need.clean = 100; emote('smile'); toast(`${baby.name} is sparkly clean`); }
  if (kind === 'play'){ baby.need.fun = Math.min(100, baby.need.fun + 35); emote('heart'); toast(`${baby.name} bounces about`); }
  if (kind === 'nap'){ if (S.napT > 0){ S.napT = 0; toast(`${baby.name} wakes up, a bit grumpy`); } else { S.napT = 6; toast(`${baby.name} curls up for a nap`); } }
  renderAll();
}
let lastEmote = null;
function emote(k){ lastEmote = {k, t: Date.now()}; }
function cycleSpeed(){ S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; S.paused = false; applySpeed(); renderAll(); }
function setSpeed(v){ S.speed = v; S.paused = false; applySpeed(); renderAll(); }
function togglePause(){ S.paused = !S.paused; renderAll(); }
function applySpeed(){ morphis.forEach(m => m.el && (m.el.style.transitionDuration = (1.4 / S.speed) + 's')); }
function stepMorphi(dir){
  const list = morphis;
  let i = S.sel?.type === 'morphi' ? list.findIndex(m => m.id === S.sel.id) : -1;
  i = (i + dir + list.length) % list.length;
  pick('morphi', list[i].id);
  if (S.follow) lookAt(list[i].x, list[i].y);
}
function openMenu(){ S.menu = !S.menu; S.leaveAsk = false; S.exportOpen = false; if (isPhone()) S.tall = S.menu; renderAll(); }
function closeSel(){ if (S.menu){ S.menu = false; } else if (S.tool){ S.tool = null; } else S.sel = null; S.follow = false; renderAll(); }

function renderNotices(){

const held = new Set();
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea,input[type=text]')) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (S.sel?.type === 'baby' && ['1','2','3','4'].includes(k)){ feed(pantry[+k - 1].food); return; }
  const t = TOOLS.find(x => x.key === k); if (t){ if (canAfford(t.cost)) setTool(t.id); else toast(`${t.name} needs ${short(t.cost)}`); return; }
  if (k === ' '){ e.preventDefault(); togglePause(); }
  else if (k === 'Tab'){ e.preventDefault(); cycleSpeed(); toast(`Speed ${S.speed}x`); }
  else if (k === 'Escape'){ if (S.menu || S.tool || S.sel) closeSel(); else openMenu(); }
  else if (k === '[') stepMorphi(-1);
  else if (k === ']') stepMorphi(1);
  else if (k === 'f' && S.sel?.type === 'morphi'){ const m = morphis.find(x => x.id === S.sel.id); S.follow = !S.follow; if (S.follow) lookAt(m.x, m.y); renderSheet(); }
  else if (k === 'b'){ S.tab = 'build'; S.sel = null; S.menu = false; renderAll(); }
  else if (k === 'u'){ S.tab = 'bunch'; S.sel = null; S.menu = false; renderAll(); }
  else if (k === 'l'){ S.tab = 'diary'; S.sel = null; S.menu = false; renderAll(); }
  else if (k === 'h'){ S.sheetHidden = !S.sheetHidden; renderAll(); }
  else if (k === 'm'){ S.mute = !S.mute; toast(S.mute ? 'Muted' : 'Sound on'); if (S.menu) renderSheet(); }
  else if (k === 't'){ S.tiles = S.tiles === 'meadow' ? 'rogue' : 'meadow'; toast(S.tiles === 'rogue' ? 'Pixel tiles' : 'Meadow tiles'); if (S.menu) renderSheet(); }
  else if (k === 'e' && S.menu){ S.exportOpen = true; renderSheet(); setTimeout(() => $('#note')?.focus(), 30); e.preventDefault(); }
  else if ('wasd'.includes(k) && k.length === 1) held.add(k);
});

let acc = 0;
setInterval(() => {
  if (S.paused || S.menu) return;
  acc += S.speed;
  // wander
  morphis.forEach(m => {
    if (m.id === 'tib') return;
    const tx = m.ax + (Math.random() - .5) * 140, ty = m.ay + (Math.random() - .5) * 90;
    m.x = m.x + (tx - m.x) * .5; m.y = m.y + (ty - m.y) * .5;
    m.el.style.transform = `translate(${m.x}px,${m.y}px)`;
  });
  if (S.follow && S.sel?.type === 'morphi'){ const m = morphis.find(x => x.id === S.sel.id); lookAt(m.x, m.y); }
  while (acc >= 2){
    acc -= 2;
    S.left = Math.max(0, S.left - 2);
    if (S.left === 0){ S.left = 240; S.day++; }
    baby.grows = Math.max(0, baby.grows - 2);
    baby.need.fun = Math.max(0, baby.need.fun - .4); baby.need.clean = Math.max(0, baby.need.clean - .3);
    if (S.napT > 0){ S.napT = Math.max(0, S.napT - 2); baby.need.sleep = Math.min(100, baby.need.sleep + 7); if (!S.napT) toast(`${baby.name} wakes up rested`); }
    else baby.need.sleep = Math.max(0, baby.need.sleep - .3);
    // a digger digs a marked tile now and then
    const m = tiles.filter(t => t.mark && !t.dug);
    if (m.length && Math.random() < .6){ const t = m[Math.floor(Math.random() * m.length)]; t.dug = true; t.mark = false; paintTiles();
      if (t.shiny){ S.res.shinies++; log('Snip dug up a shiny!'); toast('Snip dug up a shiny!'); } }
    if (Math.random() < .15 && S.res.food < S.res.cap){ S.res.food++; }
  }
  renderStrip(); renderNotices();
  if (S.sel?.type === 'baby') renderSheet();
  $('#babyBubble') && ($('#babyBubble').style.display = (baby.need.tummy < 35 || baby.need.fun < 35 || baby.need.clean < 35) ? '' : 'none');
}, 1000);

<p>Field Journal: one thin strip for the bunch's essentials, one sheet for whatever you are looking at, the meadow in between. Everything is built from five parts on one 8px grid, in four type sizes.</p>

<p>Button (2 sizes; pressed is the toggle, so speed, tabs, job chips, Follow and Mute are all the same control), Card, List row, Meter, Chip notice. One sheet layout: caption, display name, one line of what it is doing, sections, an optional footer of at most two buttons.</p>

<h3>What is wrong with the current UI</h3>
<ol>
<li><b>Text changes size to fit.</b> The C64 face (<code>src/ui.lua:16</code>) is so wide that nearly every string goes through a "largest that fits" chain (<code>printLine</code> / <code>printFit</code> / <code>printWrap</code>, <code>src/ui.lua:373-430</code>), e.g. a morphi's name tries hud, then small (<code>src/ui.lua:1104</code>, <code>1122</code>), and its state tries small, then tiny (<code>src/ui.lua:1109</code>, <code>1159</code>). The same kind of text renders at different sizes on different screens and different morphis, and long strings get cut to "..".</li>
<li><b>Ten type sizes, then scaled again.</b> Two font sets of five (<code>src/ui.lua:44-47</code>: 10/12/16/26/46 and 12/14/18/28/44), multiplied by a fractional HUD scale clamped 0.6 to 3.0 (<code>src/ui.lua:116-132</code>) and drawn with a linear filter (<code>src/ui.lua:109</code>). A 10px pixel font at 0.93 scale on a 390-wide phone is about 9px of blur. The tiny face carries costs, key numbers and column headers (<code>src/ui.lua:1073-1074</code>, <code>1088-1090</code>, <code>1836-1840</code>).</li>
<li><b>No size system.</b> Button heights in use: 20, 22, 28, 30, 32, 34, 36, 38, 40, 44, 60, 64, 72 (<code>src/ui.lua:1222</code>, <code>1154</code>, <code>1106</code>, <code>1550</code>, <code>1426</code>, <code>1461</code>, <code>2488</code>, <code>1628</code>, <code>243</code>, <code>159</code>, <code>1685</code>); paddings of 4, 6, 8, 10, 12, 14, 16, 18 mixed in the same panel.</li>
<li><b>Low contrast.</b> Secondary text is <code>dim {0.6,0.62,0.5}</code> on a 92%-opaque bar or a 65% black wash over the map (<code>src/ui.lua:20-23</code>, <code>991</code>), and it is the tiny face that gets it.</li>
<li><b>An overstuffed top bar that moves.</b> Up to 10 values and 10 buttons plus PAUSE and DEV in one row (<code>src/ui.lua:137-142</code>, <code>627-676</code>); when they do not fit, the buttons fold under a gear and then the values fold into a dropdown (<code>src/ui.lua:714-799</code>). SPEED, UNITS, LOG and SOUND are two taps on most windows and live in different places on different screens.</li>
<li><b>Three layouts for one morphi.</b> The picked morphi is drawn as a phone strip (<code>src/ui.lua:1096-1140</code>), a desk panel inside the tool bar (<code>1141-1190</code>) or a one-line strip with 20px buttons (<code>1212-1227</code>).</li>
<li><b>Sticky tools block picking.</b> Only SELECT picks a morphi or pans (<code>main.lua:1684-1700</code>), and a tool stays out after use, so after setting out a stash you press 1 before you can look at anybody. On a phone, a drag with any other tool out marks instead of panning.</li>
<li><b>Jobs are a separate modal.</b> 14 buttons, three paragraphs of explanation and CLOSE / UNITS in its own header (<code>src/ui.lua:1621-1729</code>): four to five taps to change one job.</li>
<li><b>Baby care is two stacked modals.</b> TEND opens a full-screen panel over the meadow (<code>src/ui.lua:1414-1519</code>) and FOOD a second panel over that (<code>src/ui.lua:1524-1573</code>), then MEADOW to get back.</li>
<li><b>Buildings cannot be looked at.</b> A tap only looks for a morphi (<code>main.lua:1700</code>): there is no way to see what a basket holds.</li>
<li><b>Every panel has its own size and its own exit word.</b> Centered panels of 520, 620, 760, 900 and 980 wide (<code>src/ui.lua:1420</code>, <code>1542</code>, <code>1634</code>, <code>2485</code>, <code>2503</code>), closed by CLOSE, MEADOW, BACK or DONE.</li>
<li><b>Voice.</b> The top bar's <code>LOG</code> button (<code>src/ui.lua:141</code>) reads as a banned word, and UNITS / HAUL (<code>src/ui.lua:140</code>, <code>671</code>) are office words. Here they are Diary, Bunch and the pile.</li>
</ol>

<h3>Rules this mockup follows</h3>
<ul>
<li>A tap on a morphi, a baby or a building always picks it, whatever tool is out. Tools never block looking.</li>
<li>Nothing covers the meadow on desktop: the sheet sits beside it. On a phone it is a bottom sheet you can pull taller.</li>
<li>One notice at a time per kind, as chips at the top of the meadow: the tool you are using, Paused, then the one alert that matters.</li>
<li>Grass and leaves only matter when you build, so they live in the Build page, not the strip.</li>
<li>For the L&Ouml;VE build: one font (a rounded sans at 14px, rendered at integer scale) instead of the C64 face, and the HUD scale rounded to 1&times; or 2&times; so text is never resampled.</li>
