name = "human-resources"
love_version = "11.4"
default_targets = ["macos", "appimage", "win64", "lovejs"]
build_directory = "makelove-build"

love_files = [
    "::git-ls-tree::",
    "-*/.*",
    "-*/dist*",
    "*/libs*",
    "-*/tst*",
    "-*/legacy*",
    "-*/docs*",
]

[lovejs]
title = "Human Resources"
memory = "200000000"  # starting memory of the webpage (default is 20 MB)

[macos]
# optionally, you can include a mac-specific icon, if not mac will use the same icon as other targets
#icon_file = "macIcon.png"  # or macIcon.icns

[macos.app_metadata]
CFBundleName = "Human Resources"
CFBundleIdentifier = "dev.micahturner.human-resources"
NSHumanReadableCopyright = "Copyright © 2026 Micah Turner"
CFBundleShortVersionString = "0.1.0"

[windows.exe_metadata]
FileDescription = "{name} - {version}"
FileVersion = "{version}"
CompanyName = "Micah Turner"
LegalCopyright = "Copyright © 2026 Micah Turner"
ProductName = "{name}"
ProductVersion = "{version}"
OriginalFilename = "human-resources.exe"
