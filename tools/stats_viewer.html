<title>Morphis Run Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Steps through a Morphis run (a stats EXPORT) one day at a time: the map
   at the start of each day with what changed since the day before, the
   band, and the numbers. A run comes in pasted (the game's EXPORT shows
   it as text) and is kept in the page's database, collection "runs", named
   <exported>-<first words of the note>-b<build>.json so names sort by
   when the run was made. Claude copies them to the archive on the dev
   machine with tools/stats_archive.py. Source: tools/stats_viewer.html.
   Layout: map on top, day controls under it, then the day's numbers, what
   happened and a strip of small charts; two columns on a wide screen.
   One deliberate look, the game's own dark night palette, in both themes. */
:root {
  --bg: #15170f; --panel: #1e2117; --line: #353a29; --ink: #e7ebd7; --dim: #98a083;
  --accent: #b6d36a; --warn: #ec7a5c; --change: #ffe14a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font: 15px/1.45 var(--mono); padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px }
h1 { font: 700 1.7rem/1.1 var(--display); margin: 0; letter-spacing: .02em }
h2 { font: 700 1rem/1.2 var(--display); margin: 0 0 8px; letter-spacing: .04em; color: var(--accent); text-transform: uppercase }
.meta { color: var(--dim); font-size: .85rem; min-width: 0; overflow-wrap: anywhere }
.blurb { color: var(--ink); font-style: italic }
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-width: 0 }
.mapbox { position: relative; background: #0d0f09; border-radius: 3px; overflow: hidden; touch-action: manipulation }
#map { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: crosshair }
#tip { position: absolute; pointer-events: none; background: rgba(10, 12, 7, .92); border: 1px solid var(--line); padding: 4px 8px; font-size: .8rem; border-radius: 3px; white-space: nowrap }
.controls { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: center; margin-top: 10px }
button, select, input { font: inherit; color: inherit }
.btn { background: #2a2f20; border: 1px solid var(--line); border-radius: 3px; padding: 8px 12px; cursor: pointer; min-width: 44px; font-family: var(--display); font-weight: 500 }
.btn:hover { border-color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); color: #15170f; border-color: var(--accent) }
:focus-visible { outline: 2px solid var(--change); outline-offset: 2px }
input[type=range] { width: 100%; accent-color: var(--accent) }
.daylabel { font: 700 1.25rem/1.2 var(--display); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline }
.daylabel .season { color: var(--accent) }
.daylabel .sub { color: var(--dim); font: .85rem var(--mono) }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: .85rem; color: var(--dim) }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer }
.opts input { accent-color: var(--accent) }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; margin: 0 }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding: 2px 0 }
.stats dt { color: var(--dim) }
.stats dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right }
.delta { font-size: .75rem; margin-left: 4px }
.up { color: var(--accent) } .down { color: var(--warn) }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: .88rem }
ul.list li { display: flex; gap: 8px; min-width: 0 }
ul.list .n { color: var(--change); min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; flex: none }
ul.list .k { color: var(--dim); min-width: 5.5em; flex: none }
ul.list .t { min-width: 0; overflow-wrap: anywhere }
.k.left, .k.starved { color: var(--warn) } .k.arrived, .k.milestone { color: var(--accent) }
.empty { color: var(--dim); font-size: .88rem }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.chart h3 { font: 500 .78rem var(--mono); color: var(--dim); margin: 0 0 4px; display: flex; gap: 10px; flex-wrap: wrap }
.chart h3 i { font-style: normal; display: inline-flex; gap: 4px; align-items: center }
.chart h3 i::before { content: ""; width: 10px; height: 3px; background: var(--c) }
.chart canvas { width: 100%; height: 90px; display: block; cursor: pointer }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--dim) }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.legend b { width: 11px; height: 11px; display: inline-block; border-radius: 2px }
.runs { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) }
@media (min-width: 900px) { .runs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } }
.runs textarea { width: 100%; min-height: 6.5rem; resize: vertical; background: #0d0f09; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 8px; font: 12px/1.35 var(--mono) }
.runs .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px }
.runs .say { color: var(--dim); font-size: .85rem; min-width: 0; overflow-wrap: anywhere }
.runs .say.bad { color: var(--warn) }
ul.saved { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 12.5rem; overflow-y: auto; font-size: .85rem }
ul.saved button { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 5px 8px; cursor: pointer; overflow-wrap: anywhere; color: var(--ink); font: inherit }
ul.saved button:hover { border-color: var(--line) }
ul.saved button[aria-current="true"] { border-color: var(--accent); color: var(--accent) }
.side { display: grid; gap: 16px; align-content: start; min-width: 0 }
.band li .t { color: var(--ink) }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>

<div class="wrap">
  <header>
    <h1>Morphis Run Viewer</h1>
    <div class="meta" id="meta">Paste a run below, or pick a saved one.</div>
  </header>

  <section class="card runs" aria-label="Runs">
    <div>
      <h2><label for="paste">Paste a run</label></h2>
      <textarea id="paste" placeholder="In the game: DEV on the top bar, then EXPORT. Copy the text it shows and paste it here."></textarea>
      <div class="row">
        <button class="btn" id="add" type="button">VIEW AND SAVE</button>
        <span class="say" id="say" role="status"></span>
      </div>
    </div>
    <div>
      <h2>Saved runs</h2>
      <ul class="saved" id="saved"><li class="empty">Loading…</li></ul>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="mapbox"><canvas id="map" width="960" height="640" aria-label="The map at the start of the day"></canvas><div id="tip" hidden></div></div>
      <div class="daylabel"><span id="dayname">Day –</span><span class="season" id="season"></span><span class="sub" id="changed"></span></div>
      <div class="controls">
        <button class="btn" id="prev" type="button" aria-label="Previous day">◀</button>
        <button class="btn" id="play" type="button" aria-pressed="false">PLAY</button>
        <input type="range" id="slider" min="1" max="1" value="1" aria-label="Day">
        <button class="btn" id="next" type="button" aria-label="Next day">▶</button>
        <select id="speed" aria-label="Play speed"><option value="900">slow</option><option value="400" selected>normal</option><option value="120">fast</option></select>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="showChanges" checked> outline what changed since yesterday</label>
        <label><input type="checkbox" id="showBand" checked> show the band</label>
        <label><input type="checkbox" id="onlyChanges"> dim everything else</label>
      </div>
      <div class="legend" id="legend" style="margin-top:10px"></div>
    </section>

    <div class="side">
      <section class="card"><h2>Start of the day</h2><dl class="stats" id="stats"></dl></section>
      <section class="card"><h2>Since yesterday</h2><ul class="list" id="changes"></ul></section>
      <section class="card"><h2>That day</h2><ul class="list" id="events"></ul></section>
      <section class="card"><h2>The band</h2><ul class="list band" id="band"></ul></section>
    </div>
  </div>

  <section class="card">
    <h2>The whole run</h2>
    <div class="charts" id="charts"></div>
  </section>
</div>

<script>
// Tile colours: the game's own palette (src/constants.lua), one per map character.
const TILES = {
  '~': ['water', '#5f8fa8'], '.': ['grass', '#849151'], ',': ['dirt', '#a38f5b'], '#': ['stone', '#625f5a'],
  '*': ['snow', '#dfe3e8'], '=': ['bridge', '#8a6f3f'], 'C': ['camp', '#c9b27a'], 'W': ['wall', '#5e4524'],
  'D': ['door', '#a6823f'], 'b': ['bush', '#3f6a2e'], 'B': ['ripe bush', '#d2563f'], 't': ['tree', '#24502a'],
  'T': ['stump', '#7a5a34'], 'g': ['gold ore', '#e3b93c'], 's': ['floor spot', '#bba86e'], 'n': ['bin', '#6e3f22'],
  'z': ['bed', '#4a6fa8'], '+': ['being built', '#f1f1e6'],
};
const ROLE_COLOR = { forager: '#ff8fb0', lumberjack: '#9fe0ff', miner: '#ffd27a', builder: '#ffffff' };
// What a change from one character to another means, in words.
function describe(a, b) {
  const n = c => (TILES[c] || ['?'])[0];
  if (a === 'b' && b === 'B') return 'bush ripened';
  if (a === 'B' && b === 'b') return 'bush picked';
  if ((a === 'b' || a === 'B') && !'bB'.includes(b)) return 'bush withered';
  if (a === 't' && b === 'T') return 'tree felled';
  if (a === 'T' && b === 't') return 'tree regrew';
  if (a === 'g') return 'gold ore dug out';
  if ((a === '#' || a === '*') && b === ',') return 'rock mined';
  if (a === '~' && b === '=') return 'bridge built';
  if (b === '+') return 'site marked';
  if (a === '+') return n(b) + ' built';
  if ('bBtg'.includes(b)) return 'new ' + n(b) + ' grew';
  if (b === 's') return 'floor spot marked';
  if (b === 'n') return 'bin placed';
  if (b === 'z') return 'bed placed';
  return n(a) + ' → ' + n(b);
}

const $ = id => document.getElementById(id);
// the game writes an empty list as {} (Lua cannot tell them apart)
const arr = v => Array.isArray(v) ? v : [];
const cv = $('map'), ctx = cv.getContext('2d');
let run = null, grids = [], day = 1, timer = null, cell = 10;

// Every day's map, rebuilt once from the first day and the daily changes.
function buildGrids(r) {
  const out = [];
  const maps = arr(r.maps);
  if (!maps.length) return out;
  let g = maps[0].full.map(row => row.split(''));
  out.push(g.map(row => row.slice()));
  for (let d = 1; d < maps.length; d++) {
    const ch = Array.isArray(maps[d].changes) ? maps[d].changes : [];
    for (const [x, y, c] of ch) g[y - 1][x - 1] = c;
    out.push(g.map(row => row.slice()));
  }
  return out;
}
function changesOn(d) {
  if (d <= 1 || !run.maps[d - 1]) return [];
  const ch = run.maps[d - 1].changes;
  return Array.isArray(ch) ? ch : [];
}

function drawMap() {
  const g = grids[day - 1];
  if (!g) return;
  const h = g.length, w = g[0].length;
  cell = Math.max(6, Math.floor(1100 / w));
  if (cv.width !== w * cell) { cv.width = w * cell; cv.height = h * cell; }
  const changes = changesOn(day);
  const changed = new Set(changes.map(([x, y]) => x + ',' + y));
  const dim = $('onlyChanges').checked;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = g[y][x];
    const col = (TILES[c] || ['?', '#ff00ff'])[1];
    ctx.globalAlpha = dim && !changed.has((x + 1) + ',' + (y + 1)) ? 0.25 : 1;
    ctx.fillStyle = col;
    ctx.fillRect(x * cell, y * cell, cell, cell);
    // nodes sit on grass: a small mark keeps them apart from flat ground
    if ('bBtTg'.includes(c)) {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(x * cell + cell * .3, y * cell + cell * .3, cell * .4, cell * .4);
    }
  }
  ctx.globalAlpha = 1;
  if ($('showChanges').checked) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--change').trim() || '#ffe14a';
    ctx.lineWidth = Math.max(2, cell / 5);
    for (const [x, y] of changes) ctx.strokeRect((x - 1) * cell + 1, (y - 1) * cell + 1, cell - 2, cell - 2);
  }
  const band = bandOn(day);
  if ($('showBand').checked) for (const m of band) {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc((m.x - .5) * cell, (m.y - .5) * cell, cell * .62, 0, 7); ctx.fill();
    ctx.fillStyle = ROLE_COLOR[m.role] || '#fff';
    ctx.beginPath(); ctx.arc((m.x - .5) * cell, (m.y - .5) * cell, cell * .45, 0, 7); ctx.fill();
  }
}
function bandOn(d) { const r = run.days[d - 1]; return r && Array.isArray(r.band) ? r.band : []; }

const STAT_ROWS = [
  ['pop', 'morphis'], ['hunger', 'avg hunger'], ['morale', 'avg morale'], ['hungry', 'hungry'],
  ['work', 'working'], ['idle', 'idle'], ['rest', 'resting'], ['sulk', 'sulking'],
  ['storedFood', 'food stored'], ['stockLogs', 'logs'], ['stockGold', 'gold'],
  ['food', 'food gathered'], ['logs', 'logs felled'], ['gold', 'gold dug'],
  ['arrived', 'arrived'], ['left', 'left'], ['starved', 'starved'], ['hardships', 'hardships'],
  ['ripeBushes', 'ripe bushes'], ['trees', 'trees'], ['ore', 'gold ore'],
];
const BAD_WHEN_UP = new Set(['hungry', 'idle', 'sulk', 'left', 'starved', 'hardships']);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderSide() {
  const r = run.days[day - 1] || {}, prev = run.days[day - 2];
  const dl = $('stats'); dl.replaceChildren();
  for (const [k, label] of STAT_ROWS) {
    if (r[k] == null) continue;
    const wrap = el('div'), dd = el('dd', null, String(r[k]));
    if (prev && prev[k] != null && prev[k] !== r[k]) {
      const diff = Math.round((r[k] - prev[k]) * 10) / 10;
      const bad = BAD_WHEN_UP.has(k) ? diff > 0 : diff < 0;
      dd.append(el('span', 'delta ' + (bad ? 'down' : 'up'), (diff > 0 ? '+' : '') + diff));
    }
    wrap.append(el('dt', null, label), dd);
    dl.append(wrap);
  }
  // what changed on the map, counted by kind
  const counts = new Map();
  const before = grids[day - 2];
  for (const [x, y, c] of changesOn(day)) {
    const what = describe(before ? before[y - 1][x - 1] : '?', c);
    counts.set(what, (counts.get(what) || 0) + 1);
  }
  const ul = $('changes'); ul.replaceChildren();
  if (!counts.size) ul.append(el('li', 'empty', day === 1 ? 'The first day: the map as it started.' : 'Nothing on the map changed.'));
  [...counts].sort((a, b) => b[1] - a[1]).forEach(([what, n]) => {
    const li = el('li'); li.append(el('span', 'n', n + '×'), el('span', 't', what)); ul.append(li);
  });
  // events and milestones during the day before this one started
  const ev = $('events'); ev.replaceChildren();
  const list = [];
  for (const m of arr(run.milestones)) if (m.day === day) list.push(['milestone', m.text]);
  const hard = {};
  for (const e of arr(run.events)) {
    if (e.day !== day) continue;
    if (e.kind === 'hardship') { const key = e.text || 'hardship'; hard[key] = (hard[key] || []).concat(e.who || '?'); continue; }
    const words = { arrived: 'arrived', left: 'had enough and left', starved: 'starved and wandered off', trade: 'struck a deal' };
    list.push([e.kind, (e.who || 'Someone') + ' ' + (words[e.kind] || e.kind)]);
  }
  const HARD = { bored: 'nothing to do', slow: 'gave up a long walk', hungry: 'hungry, food walled off', unreachable: "couldn't reach work" };
  for (const k in hard) list.push(['hardship', (HARD[k] || k) + ': ' + hard[k].join(', ')]);
  if (!list.length) ev.append(el('li', 'empty', 'Nothing happened.'));
  for (const [k, t] of list) { const li = el('li'); li.append(el('span', 'k ' + k, k), el('span', 't', t)); ev.append(li); }
  // the band
  const bl = $('band'); bl.replaceChildren();
  const band = bandOn(day);
  if (!band.length) bl.append(el('li', 'empty', r.band ? 'Nobody left.' : 'This run was exported before builds recorded where each morphi stands (build 110).'));
  for (const m of band) {
    const li = el('li'), dot = el('span', 'k');
    dot.textContent = '● ' + m.role.slice(0, 3); dot.style.color = ROLE_COLOR[m.role] || 'inherit';
    li.append(dot, el('span', 't', m.name + '  ' + m.doing + '  hunger ' + m.hunger + '  morale ' + m.morale + '  at ' + m.x + ',' + m.y));
    bl.append(li);
  }
  $('dayname').textContent = 'Day ' + day + ' of ' + run.days.length;
  $('season').textContent = r.season || '';
  $('changed').textContent = day > 1 ? changesOn(day).length + ' tiles changed' : 'the starting map';
}

// Small charts for the whole run, with today marked. Tap one to jump.
const CHARTS = [
  ['The band', [['pop', 'morphis', '#e7ebd7'], ['hungry', 'hungry', '#ec7a5c'], ['idle', 'idle', '#ffe14a']]],
  ['Mood', [['hunger', 'hunger', '#ec7a5c'], ['morale', 'morale', '#b6d36a']]],
  ['Gathered', [['food', 'food', '#d2563f'], ['logs', 'logs', '#a3794a'], ['gold', 'gold', '#e3b93c']]],
  ['Comings and goings', [['arrived', 'arrived', '#b6d36a'], ['left', 'left', '#ec7a5c'], ['hardships', 'hardships', '#98a083']]],
];
function drawCharts() {
  const box = $('charts');
  if (!box.children.length) {
    for (const [title, series] of CHARTS) {
      const c = el('div', 'chart'), h = el('h3', null, title + ' ');
      for (const [, label, color] of series) { const i = el('i', null, label); i.style.setProperty('--c', color); h.append(i); }
      const canvas = el('canvas'); canvas.height = 180;
      canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        go(Math.round(1 + (e.clientX - rect.left) / rect.width * (run.days.length - 1)));
      });
      c.append(h, canvas); box.append(c);
    }
  }
  [...box.querySelectorAll('canvas')].forEach((canvas, ci) => {
    const w = canvas.width = Math.max(200, Math.round(canvas.clientWidth * 2)), h = canvas.height;
    const c = canvas.getContext('2d'), days = run.days, series = CHARTS[ci][1];
    c.clearRect(0, 0, w, h);
    let max = 1;
    for (const [k] of series) for (const d of days) max = Math.max(max, d[k] || 0);
    const X = i => 6 + i / Math.max(1, days.length - 1) * (w - 12), Y = v => h - 8 - v / max * (h - 22);
    // season boundaries
    c.strokeStyle = '#353a29'; c.lineWidth = 1;
    const per = run.meta.daysPerSeason || 9;
    for (let s = per; s < days.length; s += per) { c.beginPath(); c.moveTo(X(s), 4); c.lineTo(X(s), h - 4); c.stroke(); }
    // milestone days: dashed gold
    c.strokeStyle = '#e3b93c'; c.setLineDash([6, 6]); c.lineWidth = 1.5;
    for (const m of arr(run.milestones)) { c.beginPath(); c.moveTo(X(m.day - 1), 4); c.lineTo(X(m.day - 1), h - 4); c.stroke(); }
    c.setLineDash([]);
    c.fillStyle = '#98a083'; c.font = '20px IBM Plex Mono, monospace'; c.textAlign = 'right'; c.fillText('max ' + max, w - 6, 18); c.textAlign = 'left';
    for (const [k, , color] of series) {
      c.strokeStyle = color; c.lineWidth = 3; c.beginPath();
      days.forEach((d, i) => { const p = [X(i), Y(d[k] || 0)]; i ? c.lineTo(...p) : c.moveTo(...p); });
      c.stroke();
    }
    c.strokeStyle = '#ffe14a'; c.lineWidth = 2; c.beginPath(); c.moveTo(X(day - 1), 0); c.lineTo(X(day - 1), h); c.stroke();
  });
}

function go(d) {
  if (!run) return;
  day = Math.max(1, Math.min(run.days.length, d));
  $('slider').value = day;
  drawMap(); renderSide(); drawCharts();
  try { localStorage.setItem('day:' + (run.meta.exportedAt || run.meta.seed), String(day)); } catch (e) {}
}
function stop() { clearInterval(timer); timer = null; $('play').setAttribute('aria-pressed', 'false'); $('play').textContent = 'PLAY'; }
function play() {
  if (timer) return stop();
  if (day >= run.days.length) go(1);
  $('play').setAttribute('aria-pressed', 'true'); $('play').textContent = 'STOP';
  timer = setInterval(() => { if (day >= run.days.length) stop(); else go(day + 1); }, Number($('speed').value));
}

function load(r, label) {
  if (!r || !Array.isArray(r.days) || !r.days.length) { $('meta').textContent = 'That file has no days in it. Pick a stats export (.json).'; return; }
  stop();
  run = r; grids = buildGrids(r);
  const m = r.meta || {};
  $('meta').replaceChildren(
    document.createTextNode([label, 'seed ' + m.seed, m.difficulty || m.level || m.mode, 'build ' + m.build, r.days.length + ' days', m.exportedAt ? 'exported ' + m.exportedAt : ''].filter(Boolean).join(' · ')),
    m.blurb ? el('div', 'blurb', '"' + m.blurb + '"') : '');
  $('slider').max = r.days.length;
  $('charts').replaceChildren();
  let start = 1;
  try { start = Number(localStorage.getItem('day:' + (m.exportedAt || m.seed))) || 1; } catch (e) {}
  go(start);
}

// legend
for (const [c, [name, col]] of Object.entries(TILES)) {
  const s = el('span'), b = el('b'); b.style.background = col; s.append(b, name); $('legend').append(s);
}
for (const [role, col] of Object.entries(ROLE_COLOR)) {
  if (role === 'builder') continue;
  const s = el('span'), b = el('b'); b.style.background = col; b.style.borderRadius = '50%'; s.append(b, role); $('legend').append(s);
}

$('prev').onclick = () => { stop(); go(day - 1); };
$('next').onclick = () => { stop(); go(day + 1); };
$('play').onclick = play;
$('slider').oninput = e => { stop(); go(Number(e.target.value)); };
for (const id of ['showChanges', 'showBand', 'onlyChanges']) $(id).onchange = drawMap;
document.addEventListener('keydown', e => {
  if (!run || e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(day - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(day + 1); }
  else if (e.key === ' ') { e.preventDefault(); play(); }
});
window.addEventListener('resize', () => run && drawCharts());

// hover or tap a tile: what is there, and who
function tipAt(ev) {
  if (!run) return;
  const rect = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) / rect.width * (cv.width / cell)) + 1;
  const y = Math.floor((ev.clientY - rect.top) / rect.height * (cv.height / cell)) + 1;
  const g = grids[day - 1]; if (!g || !g[y - 1] || g[y - 1][x - 1] == null) return;
  const c = g[y - 1][x - 1], before = grids[day - 2];
  let text = x + ',' + y + '  ' + (TILES[c] || [c])[0];
  if (before && before[y - 1][x - 1] !== c) text += '  (' + describe(before[y - 1][x - 1], c) + ')';
  const who = bandOn(day).filter(m => m.x === x && m.y === y).map(m => m.name);
  if (who.length) text += '  ' + who.join(', ');
  const tip = $('tip'); tip.textContent = text; tip.hidden = false;
  const box = cv.parentElement.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX - box.left + 12, box.width - tip.offsetWidth - 4) + 'px';
  tip.style.top = Math.max(4, ev.clientY - box.top - 30) + 'px';
}
cv.addEventListener('pointermove', tipAt);
cv.addEventListener('pointerdown', tipAt);
cv.addEventListener('pointerleave', () => { $('tip').hidden = true; });

// Saved runs ---------------------------------------------------------------
// The same name the game gives a run (Stats.runName in src/stats.lua): when
// it was exported, the first five words of the note, the build.
function runName(r) {
  const m = r.meta || {};
  if (m.runName) return m.runName;
  const at = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d):(\d\d)/.exec(m.exportedAt || '');
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const stamp = at ? at.slice(1, 4).join('') + '-' + at.slice(4, 7).join('')
    : now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + '-' + p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds());
  const words = (String(m.blurb || '').toLowerCase().match(/[a-z0-9]+/g) || []).slice(0, 5);
  const slug = words.join('-').slice(0, 40).replace(/-+$/, '') || 'run';
  return stamp + '-' + slug + '-b' + (m.build || 0) + '.json';
}
const PART = 200000;
let db = null, saved = new Map(), showing = null;
function say(t, bad) { $('say').textContent = t; $('say').className = 'say' + (bad ? ' bad' : ''); }
function renderSaved() {
  const ul = $('saved'); ul.replaceChildren();
  if (!db) { ul.append(el('li', 'empty', 'Saving needs this page open signed in on claude.ai. Pasted runs still show.')); return; }
  const names = [...saved.keys()].sort().reverse();
  if (!names.length) ul.append(el('li', 'empty', 'None yet. Paste one to start.'));
  for (const n of names) {
    const b = el('button', null, n.replace(/\.json$/, ''));
    b.type = 'button';
    if (n === showing) b.setAttribute('aria-current', 'true');
    b.onclick = () => openSaved(n);
    const li = el('li'); li.append(b); ul.append(li);
  }
}
function textOf(name) {
  const parts = saved.get(name) || [];
  const total = Math.max(0, ...parts.map(p => p.parts || 1));
  if (parts.length < total) return null;
  return parts.slice().sort((a, b) => a.part - b.part).map(p => p.text).join('');
}
function openSaved(name) {
  const text = textOf(name);
  if (!text) { say(name + ' is still arriving. Try again in a moment.', true); return; }
  try { showing = name; load(JSON.parse(text), name); renderSaved(); say(''); }
  catch (err) { say(name + ' could not be read: ' + err.message, true); }
}
$('add').onclick = async () => {
  const text = $('paste').value.trim();
  if (!text) { say("Paste the text the game's EXPORT shows first.", true); $('paste').focus(); return; }
  let r;
  try { r = JSON.parse(text); } catch (err) { say('That is not a whole run: ' + err.message + '. Copy all of the export text and try again.', true); return; }
  if (!r || !Array.isArray(r.days) || !r.days.length) { say("That JSON has no days in it. Paste a run from the game's EXPORT.", true); return; }
  const name = runName(r);
  showing = name;
  load(r, name);
  if (!db) { say('Showing it. It is not saved: open this page signed in on claude.ai to keep runs.'); return; }
  if (saved.has(name)) { say('Showing it. Already saved as ' + name + '.'); renderSaved(); return; }
  $('add').disabled = true;
  try {
    const parts = Math.max(1, Math.ceil(text.length / PART)), at = new Date().toISOString(), base = name.replace(/\.json$/, '');
    for (let i = 0; i < parts; i++) {
      await db.collection('runs').doc(base + '--' + (i + 1)).set({ name, part: i + 1, parts, savedAt: at, text: text.slice(i * PART, (i + 1) * PART) });
    }
    $('paste').value = '';
    say('Saved as ' + name + '. Claude archives it on the dev machine.');
  } catch (err) {
    say('Showing it, but it did not save (' + (err && err.code || 'error') + '). Try again.', true);
  }
  $('add').disabled = false;
};

renderSaved();
(async () => {
  if (!window.claude || !window.claude.use) return;
  db = await claude.use('db');
  if (!db) { renderSaved(); return; }
  let first = true;
  db.collection('runs').onSnapshot(snap => {
    saved = new Map();
    for (const d of snap.docs) {
      const doc = d.data();
      if (!doc || !doc.name) continue;
      if (!saved.has(doc.name)) saved.set(doc.name, []);
      saved.get(doc.name).push(doc);
    }
    renderSaved();
    // open the newest run the first time the list arrives
    if (first && !run && saved.size) { first = false; openSaved([...saved.keys()].sort().pop()); }
  }, () => say('The saved runs stopped updating. Reload the page.', true));
})();
</script>
